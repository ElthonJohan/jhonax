<mat-toolbar color="primary" class="navbar-main">
  <div class="navbar-container">
    <!-- Logo - Siempre visible -->
    <a mat-button class="link-logo" routerLink="/" fragment="hero">
      <div class="logo-section" routerLink="/hero">
        <mat-icon class="logo-icon">storefront</mat-icon>
        <div class="logo-text-wrapper">
          <span class="logo-text">JHONAX</span>
          <span class="logo-subtitle">TEXTIL • LANDING</span>
        </div>
      </div>
    </a>

    <!-- Menú Desktop - Solo visible en desktop -->
    <div class="desktop-menu">
      <a mat-button routerLink="/" fragment="nosotros" class="nav-link">Nosotros</a>
      <a mat-button routerLink="/" fragment="servicios" class="nav-link">Servicios</a>
      <a mat-button routerLink="/" fragment="eligenos" class="nav-link">Eligenos</a>
      <a mat-button routerLink="/" fragment="blog" class="nav-link">Tendencias</a>
    </div>

    <!-- Acciones derecha - Siempre visibles pero diferentes en móvil/desktop -->
    <div class="actions-section">
      <!-- Botón CONTACT - Solo visible en desktop -->
      <button mat-raised-button class="contact-button desktop-only">
        CONTACT
        <mat-icon>arrow_forward</mat-icon>
      </button>

      <!-- Botón Hamburguesa - Solo visible en móvil -->
      <button mat-icon-button class="hamburger-btn mobile-only" (click)="toggleMenu()">
        <mat-icon>{{ showMenu ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  <!-- Menú Móvil Overlay -->
  <div *ngIf="showMenu" class="mobile-menu-wrapper">
    <div class="mobile-overlay" (click)="closeMenu()"></div>
    <div class="mobile-menu-panel">
      <a mat-button routerLink="/" fragment="nosotros" (click)="closeMenu()">Nosotros</a>
      <a mat-button routerLink="/" fragment="servicios" (click)="closeMenu()">Servicios</a>
      <a mat-button routerLink="/" fragment="eligenos" (click)="closeMenu()">Eligenos</a>
      <a mat-button routerLink="/" fragment="blog" (click)="closeMenu()">Tendencias</a>
      <button mat-raised-button class="mobile-contact-btn" (click)="closeMenu()">CONTACT</button>
    </div>
  </div>
</mat-toolbar>

<!-- Aquí se renderiza el contenido -->
<div class="p-2 md:p-6">
  <router-outlet></router-outlet>
</div>
